{% extends "base.html" %}
{% block title %}Projects — Project OS{% endblock %}
{% block content %}
<h2>Projects</h2>
<ul>
  {% for project in projects %}
  <li><a href="/projects/{{ project['id'] }}">{{ project["name"] }}</a></li>
  {% else %}
  <li>No projects yet.</li>
  {% endfor %}
</ul>
{% endblock %}
